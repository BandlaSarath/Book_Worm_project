# ── Application ──────────────────────────────────────────────────────────────
spring.application.name=Book Worm

# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── DataSource (PostgreSQL) ──────────────────────────────────────────────────
# All credentials supplied exclusively via environment variables.
# No fallback values for username or password – the application will refuse
# to start if DB_USERNAME or DB_PASSWORD are not set, which is the correct
# security behaviour.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookworm}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Connection pool (HikariCP – Spring Boot default) ────────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
# ddl-auto=update: Hibernate creates/alters tables on startup to match entities.
# Safe for development; switch to 'validate' before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Security / JWT ───────────────────────────────────────────────────────────
# JWT secret must be a Base64-encoded string of at least 32 bytes.
# Supply via JWT_SECRET environment variable – no hardcoded default.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.jwt.guest-expiration-ms=3600000

# ── Springdoc / Swagger UI ────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.bookworm=INFO
logging.level.org.springframework.security=WARN
